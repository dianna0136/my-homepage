body::before { left: 0; }
body::after { right: 0; transform: scaleX(-1); top: auto; bottom: 36px; }

/* 漂浮小装饰层：小花/星星/云朵/蝴蝶结 缓慢游动 */
.drift {
  position: fixed; z-index: 0; pointer-events: none;
  font-size: var(--sz); opacity: var(--op);
  animation: driftA var(--t) ease-in-out var(--d) infinite alternate;
  filter: drop-shadow(0 2px 3px rgba(196,105,126,.12));
}
@keyframes driftA { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-26px) rotate(10deg); } }
@keyframes driftB { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(18px) rotate(-12deg); } }

.wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 0 24px 64px; }

/* 顶部条 */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 6px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--rose); text-decoration: none; font-weight: 600; font-size: 14.5px;
  padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.75);
  box-shadow: 0 6px 16px rgba(176,116,138,.12); transition: transform .18s, box-shadow .18s;
}
.back-link:hover { transform: translateX(-3px) translateY(-1px); box-shadow: 0 10px 20px rgba(176,116,138,.18); color: var(--rose-deep); }
.lang-btn {
  border: none; cursor: pointer; font-family: var(--serif); font-size: 14px; font-weight: 700;
  color: var(--rose-deep); background: rgba(255,255,255,.75);
  padding: 9px 18px; border-radius: 999px; box-shadow: 0 6px 16px rgba(176,116,138,.12);
  transition: transform .18s, box-shadow .18s;
}
.lang-btn:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 10px 20px rgba(176,116,138,.2); }

/* Hero */
.hero { text-align: center; padding: 38px 0 30px; }
.eyebrow {
  display: inline-block; color: var(--rose); font-size: 12px; font-weight: 700;
  letter-spacing: 4px; text-transform: uppercase;
  background: rgba(255,255,255,.7); padding: 6px 16px; border-radius: 999px;
  box-shadow: inset 0 0 0 1.5px dashed var(--pink);
}
.hero h1 {
  font-family: var(--serif); font-weight: 600; color: var(--gray-strong);
  font-size: 44px; margin: 14px 0 10px; letter-spacing: 1px;
}
.hero h1 em { font-style: italic; color: var(--rose-deep); position: relative; }
.hero h1 .heart { font-style: normal; font-size: 34px; }
.hero p { color: var(--gray-soft); font-size: 15.5px; max-width: 580px; margin: 0 auto; }

/* 板块 */
section.gallery { margin-top: 34px; }
.gallery-head { text-align: center; margin-bottom: 24px; position: relative; }
.gallery-head .badge {
  display: inline-block; font-size: 22px; background: #fff; border-radius: 50%;
  width: 52px; height: 52px; line-height: 52px; box-shadow: 0 8px 18px rgba(176,116,138,.16);
  margin-bottom: 8px; animation: bob 3s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.gallery-head h2 { font-family: var(--serif); font-weight: 600; font-size: 29px; color: var(--gray-strong); }
.gallery-head p { color: var(--gray-soft); font-size: 14.5px; margin-top: 2px; }

/* 图片网格：拍立得风黏土相框 */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.photo-card {
  background: #ffffff;
  border-radius: var(--radius);
  padding: 12px 12px 8px;
  box-shadow: 0 14px 26px rgba(176,116,138,.12), inset 0 2px 6px rgba(255,255,255,.9);
  transition: transform .22s ease, box-shadow .22s ease;
}
.photo-card:hover { transform: translateY(-7px) rotate(.8deg); box-shadow: 0 22px 36px rgba(176,116,138,.2); }
.photo-frame {
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  overflow: hidden;
  background: linear-gradient(160deg, #fdf6f8, #f6edf1);
  position: relative;
  border: 3px solid #fff;
  box-shadow: inset 0 0 0 1.5px var(--pink-soft), 0 4px 10px rgba(196,105,126,.08);
}
.photo-frame img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform .35s ease;
}
.photo-card:hover .photo-frame img { transform: scale(1.05); }

/* 一对组合相框：两张大头照并排，中间爱心 */
.pair-frame { display: flex; align-items: center; gap: 0; background: var(--blush); }
.pair-frame .pair-half { flex: 1; height: 100%; min-width: 0; }
.pair-frame .pair-half img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pair-frame .pair-half:first-child img { border-radius: 17px 0 0 17px; }
.pair-frame .pair-half:last-child img { border-radius: 0 17px 17px 0; }
.pair-heart {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  background: #fff; border-radius: 50%; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; box-shadow: 0 4px 12px rgba(196,105,126,.3);
  z-index: 2; animation: beat 1.6s ease-in-out infinite;
}
@keyframes beat { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.15); } }

/* Footer */
footer { text-align: center; margin-top: 58px; color: var(--gray-soft); font-size: 13px; }
footer a { color: var(--rose); text-decoration: none; font-weight: 600; }
footer .tiny-hearts { letter-spacing: 4px; color: var(--pink); margin-bottom: 4px; }

body.lang-en .hero h1 em { color: var(--rose-deep); }

@media (max-width: 820px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .hero h1 { font-size: 33px; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 29px; }
}
</style>

<script>
  var yearEl = document.getElementById('year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();
  var btn = document.getElementById('langBtn');
  var isEn = false;
  function apply(en) {
    document.querySelectorAll('[data-zh]').forEach(function (el) {
      if (el.hasAttribute('data-en')) el.innerHTML = en ? el.getAttribute('data-en') : el.getAttribute('data-zh');
    });
    document.body.classList.toggle('lang-en', en);
    isEn = en;
  }
  btn.addEventListener('click', function () { apply(!isEn); });
</script>
